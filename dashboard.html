<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Telemetry Dashboard</title><style>
body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#0d131d;color:#eef4ff}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}.status{padding:7px 12px;border-radius:999px;background:#1d2838}.ok{color:#74f4a0}.bad{color:#ff8585}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}.device{background:#172131;border:1px solid #34445e;border-radius:14px;padding:18px}.offline{opacity:.55}.device h2{margin:0 0 12px;display:flex;justify-content:space-between;gap:12px}.pill{font-size:.8rem;padding:5px 9px;border-radius:999px;background:#26354a;font-weight:700}.online-pill{color:#74f4a0}.offline-pill{color:#ff8585}table{width:100%;border-collapse:collapse;font-family:ui-monospace,monospace;font-size:.95rem}td,th{padding:6px;border-bottom:1px solid #2a384d;text-align:right}td:first-child,th:first-child{text-align:left}.trigger{margin-top:10px;height:8px;background:#0b1018;border-radius:999px;overflow:hidden}.trigger>div{height:100%;width:0;background:#78b7ff;transition:width .08s linear}.empty{padding:40px;text-align:center;color:#9aa9bd;border:1px dashed #40506a;border-radius:14px}
</style></head><body><header><div><h1 style="margin:0">XR Telemetry Dashboard</h1><div style="color:#aab8ca">Datos en tiempo real desde todas las Meta Quest</div></div><div class="status">Dashboard WS: <strong id="connectionStatus">conectando...</strong></div></header><div id="grid"><div class="empty" id="emptyState">Todavía no hay ninguna gafa conectada.</div></div>
<script>
const grid=document.getElementById('grid'),emptyState=document.getElementById('emptyState'),connectionStatus=document.getElementById('connectionStatus');function fmt(v){return v===undefined||v===null?'—':Number(v).toFixed(3)}function renderDevice(d){let card=document.getElementById(`device-${d.device_id}`);if(!card){card=document.createElement('div');card.id=`device-${d.device_id}`;card.className='device';grid.appendChild(card)}const h=d.head||{},l=(d.controllers||{}).left||{},r=(d.controllers||{}).right||{};card.className=d.connected?'device':'device offline';card.innerHTML=`<h2><span>${d.device_id}</span><span class="pill ${d.connected?'online-pill':'offline-pill'}">${d.connected?'● CONECTADA':'● DESCONECTADA'}</span></h2><div style="margin-bottom:12px;color:#9fb0c5">Paquete #${d.message_number||0}</div><table><thead><tr><th>Sensor</th><th>X</th><th>Y</th><th>Z</th><th>Trigger</th><th>Grip</th></tr></thead><tbody><tr><td>HEAD</td><td>${fmt(h.x)}</td><td>${fmt(h.y)}</td><td>${fmt(h.z)}</td><td>—</td><td>—</td></tr><tr><td>LEFT</td><td>${fmt(l.x)}</td><td>${fmt(l.y)}</td><td>${fmt(l.z)}</td><td>${fmt(l.trigger)}</td><td>${fmt(l.squeeze)}</td></tr><tr><td>RIGHT</td><td>${fmt(r.x)}</td><td>${fmt(r.y)}</td><td>${fmt(r.z)}</td><td>${fmt(r.trigger)}</td><td>${fmt(r.squeeze)}</td></tr></tbody></table><div style="margin-top:14px">RIGHT trigger<div class="trigger"><div style="width:${Math.max(0,Math.min(100,(r.trigger||0)*100))}%"></div></div></div>`;if(emptyState&&emptyState.parentNode)emptyState.remove()}
function connect(){const protocol=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${protocol}://${location.host}/dashboard-ws`);ws.onopen=()=>{connectionStatus.textContent='CONECTADO';connectionStatus.className='ok'};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='snapshot')Object.values(m.devices||{}).forEach(renderDevice);if(m.type==='device_update')renderDevice(m.device)};ws.onclose=()=>{connectionStatus.textContent='DESCONECTADO';connectionStatus.className='bad';setTimeout(connect,1500)};ws.onerror=()=>{connectionStatus.textContent='ERROR';connectionStatus.className='bad'}}connect();
</script></body></html>
